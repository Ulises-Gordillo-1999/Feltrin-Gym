<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gymGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
  </defs>

  <!-- Fondo redondeado estilo Squircle Dark -->
  <rect width="64" height="64" rx="16" fill="#09090b" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#27272a" stroke-width="2" />
  <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#gymGradient)" opacity="0.18" />

  <!-- Pesa Dumbbell Premium Centrada Dinámica -->
  <g transform="translate(32, 32) rotate(-45) translate(-32, -32)">
    <!-- Barra de agarre central -->
    <rect x="22" y="29" width="20" height="6" rx="3" fill="#ffffff" />
    
    <!-- Discos medianos internos -->
    <rect x="18" y="21" width="4.5" height="22" rx="2" fill="url(#gymGradient)" />
    <rect x="41.5" y="21" width="4.5" height="22" rx="2" fill="url(#gymGradient)" />
    
    <!-- Discos grandes pesados -->
    <rect x="11.5" y="17" width="5.5" height="30" rx="2.5" fill="url(#gymGradient)" />
    <rect x="47" y="17" width="5.5" height="30" rx="2.5" fill="url(#gymGradient)" />
    
    <!-- Topes de bloqueo de seguridad -->
    <rect x="7.5" y="24" width="3" height="16" rx="1.5" fill="#f4f4f5" />
    <rect x="53.5" y="24" width="3" height="16" rx="1.5" fill="#f4f4f5" />
  </g>
</svg>
